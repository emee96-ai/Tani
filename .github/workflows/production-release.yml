name: Tani Production Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Customer/Admin version name, for example 3.2.0
        required: true
        type: string
      version_code:
        description: Monotonic Android version code
        required: true
        type: string
      previous_version_code:
        description: Latest customer version code in Play, or 0 for the first release
        required: true
        type: string
      previous_admin_version_code:
        description: Latest admin version code in Play, or 0 for the first release
        required: true
        type: string
      app_link_host:
        description: Verified HTTPS App Link host, without scheme
        required: true
        type: string
      reset_redirect:
        description: Must be https://HOST/auth/reset
        required: true
        type: string

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/build-apk.yml

  production-release:
    needs: validation
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: tani
    env:
      TANI_APP_LINK_HOST: ${{ inputs.app_link_host }}
      TANI_RESET_REDIRECT: ${{ inputs.reset_redirect }}
      TANI_VERSION_NAME: ${{ inputs.version_name }}
      TANI_VERSION_CODE: ${{ inputs.version_code }}
      TANI_ADMIN_VERSION_NAME: ${{ inputs.version_name }}
      TANI_ADMIN_VERSION_CODE: ${{ inputs.version_code }}
      TANI_PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
      TANI_PREVIOUS_ADMIN_VERSION_CODE: ${{ inputs.previous_admin_version_code }}
      TANI_RELEASE_STORE_PASSWORD: ${{ secrets.TANI_RELEASE_STORE_PASSWORD }}
      TANI_RELEASE_KEY_ALIAS: ${{ secrets.TANI_RELEASE_KEY_ALIAS }}
      TANI_RELEASE_KEY_PASSWORD: ${{ secrets.TANI_RELEASE_KEY_PASSWORD }}
      TANI_FIREBASE_API_KEY: ${{ secrets.TANI_FIREBASE_API_KEY }}
      TANI_FIREBASE_APPLICATION_ID: ${{ secrets.TANI_FIREBASE_APPLICATION_ID }}
      TANI_FIREBASE_PROJECT_ID: ${{ secrets.TANI_FIREBASE_PROJECT_ID }}
      TANI_FIREBASE_SENDER_ID: ${{ secrets.TANI_FIREBASE_SENDER_ID }}
      TANI_TERMS_URL: ${{ vars.TANI_TERMS_URL }}
      TANI_PRIVACY_URL: ${{ vars.TANI_PRIVACY_URL }}
      TANI_ACCOUNT_DELETION_URL: ${{ vars.TANI_ACCOUNT_DELETION_URL }}
      TANI_APP_SIGNING_SHA256: ${{ vars.TANI_APP_SIGNING_SHA256 }}
      TANI_SUPABASE_SERVICE_KEY: ${{ secrets.TANI_SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Materialize release keystore
        env:
          TANI_RELEASE_KEYSTORE_B64: ${{ secrets.TANI_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$TANI_RELEASE_KEYSTORE_B64" || { echo "Missing TANI_RELEASE_KEYSTORE_B64" >&2; exit 1; }
          export TANI_RELEASE_STORE_FILE="$RUNNER_TEMP/tani-release.jks"
          printf '%s' "$TANI_RELEASE_KEYSTORE_B64" | base64 --decode > "$TANI_RELEASE_STORE_FILE"
          test -s "$TANI_RELEASE_STORE_FILE"
          echo "TANI_RELEASE_STORE_FILE=$TANI_RELEASE_STORE_FILE" >> "$GITHUB_ENV"

      - name: Validate production release gate
        run: |
          [[ "$TANI_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "version_code must be a positive integer" >&2; exit 1; }
          bash qa/run_release_gate.sh
          bash qa/run_static_checks.sh

      - name: Run database regression suite
        env:
          TANI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash qa/run_database_tests.sh

      - name: Run launch regressions against the full schema
        env:
          TANI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tani_launch_regression
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tani_launch_regression'
          bash qa/run_launch_tests.sh

      - name: Build signed minified AABs and tests
        run: |
          chmod +x gradlew
          TANI_GRADLE_ARGS=(
            --no-daemon --max-workers=1 --stacktrace
            -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
            "-PTANI_APP_LINK_HOST=$TANI_APP_LINK_HOST"
            "-PTANI_RESET_REDIRECT=$TANI_RESET_REDIRECT"
            "-PTANI_FIREBASE_API_KEY=$TANI_FIREBASE_API_KEY"
            "-PTANI_FIREBASE_APPLICATION_ID=$TANI_FIREBASE_APPLICATION_ID"
            "-PTANI_FIREBASE_PROJECT_ID=$TANI_FIREBASE_PROJECT_ID"
            "-PTANI_FIREBASE_SENDER_ID=$TANI_FIREBASE_SENDER_ID"
            "-PTANI_VERSION_NAME=$TANI_VERSION_NAME"
            "-PTANI_VERSION_CODE=$TANI_VERSION_CODE"
            "-PTANI_ADMIN_VERSION_NAME=$TANI_ADMIN_VERSION_NAME"
            "-PTANI_ADMIN_VERSION_CODE=$TANI_ADMIN_VERSION_CODE"
            "-PTANI_RELEASE_STORE_FILE=$TANI_RELEASE_STORE_FILE"
            "-PTANI_RELEASE_STORE_PASSWORD=$TANI_RELEASE_STORE_PASSWORD"
            "-PTANI_RELEASE_KEY_ALIAS=$TANI_RELEASE_KEY_ALIAS"
            "-PTANI_RELEASE_KEY_PASSWORD=$TANI_RELEASE_KEY_PASSWORD"
          )
          ./gradlew "${TANI_GRADLE_ARGS[@]}" :app:testReleaseUnitTest :adminApp:testReleaseUnitTest :app:lintRelease :adminApp:lintRelease
          ./gradlew "${TANI_GRADLE_ARGS[@]}" :app:bundleRelease :adminApp:bundleRelease

      - name: Verify signed release outputs
        run: |
          CUSTOMER_AAB="app/build/outputs/bundle/release/app-release.aab"
          ADMIN_AAB="adminApp/build/outputs/bundle/release/adminApp-release.aab"
          test -s "$CUSTOMER_AAB"
          test -s "$ADMIN_AAB"
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s adminApp/build/outputs/mapping/release/mapping.txt
          jarsigner -verify "$CUSTOMER_AAB" >/dev/null
          jarsigner -verify "$ADMIN_AAB" >/dev/null
          python3 qa/verify_native_page_size.py "$CUSTOMER_AAB" "$ADMIN_AAB"

      - name: Upload signed customer AAB
        uses: actions/upload-artifact@v4
        with:
          name: tani-production-signed-aab-${{ inputs.version_name }}
          path: tani/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed admin AAB
        uses: actions/upload-artifact@v4
        with:
          name: tani-admin-production-signed-aab-${{ inputs.version_name }}
          path: tani/adminApp/build/outputs/bundle/release/adminApp-release.aab
          if-no-files-found: error

      - name: Upload R8 mappings
        uses: actions/upload-artifact@v4
        with:
          name: tani-r8-mappings-${{ inputs.version_name }}
          path: |
            tani/app/build/outputs/mapping/release/mapping.txt
            tani/adminApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
