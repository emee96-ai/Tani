name: Build Clinic APK
on:
  workflow_dispatch:
  push:
    branches: [ clinic-app-v1 ]
    paths:
      - 'clinic-app/**'
      - '.github/workflows/build-clinic-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: clinic-app
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-app-debug
          path: clinic-app/app/build/outputs/apk/debug/app-debug.apk
