name: Build Tani APK

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main", "develop", "maintenance/**"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run database regression tests
        env:
          TANI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash tani/qa/run_database_tests.sh
      - name: Run launch authorization tests against the full live schema
        env:
          TANI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tani_launch_regression
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tani_launch_regression'
          bash tani/qa/run_launch_tests.sh

  function-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tani/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.7
      - name: Check server functions and test worker security
        run: |
          deno check --no-lock --node-modules-dir=auto maintenance-worker/index.ts delete-account/index.ts
          deno test --no-lock --node-modules-dir=auto _shared/security_test.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tani
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Project static QA
        run: bash qa/run_static_checks.sh
      - name: Build APKs and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :adminApp:assembleDebug :adminApp:testDebugUnitTest --stacktrace
      - name: Verify Tani Admin APK
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK="adminApp/build/outputs/apk/debug/adminApp-debug.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "adminApp/build/outputs/apk/debug/Tani-Admin-debug.apk"
      - name: Upload Tani APK
        uses: actions/upload-artifact@v4
        with:
          name: tani-debug-apk
          path: tani/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Tani Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: tani-admin-verified-apk
          path: tani/adminApp/build/outputs/apk/debug/Tani-Admin-debug.apk
          if-no-files-found: error

  ui-smoke:
    name: ui-smoke (API ${{ matrix.api-level }}, ${{ matrix.page-size }} bytes)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
            target: google_apis
            page-size: 4096
          - api-level: 36
            target: google_apis
            page-size: 4096
          - api-level: 35
            target: google_apis_ps16k
            page-size: 16384
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Run customer UI smoke tests
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          working-directory: tani
          script: bash qa/run_android_device_tests.sh ${{ matrix.page-size }} ${{ matrix.api-level }}
      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tani-ui-smoke-reports-api-${{ matrix.api-level }}-pages-${{ matrix.page-size }}
          path: |
            tani/app/build/reports/androidTests/connected/**
            tani/app/build/outputs/androidTest-results/connected/**
            tani/app/build/outputs/androidTest-results/device-environment.json
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tani
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Android lint
        run: chmod +x gradlew && ./gradlew --no-daemon :app:lintDebug :adminApp:lintDebug --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tani-lint-reports
          path: |
            tani/app/build/reports/lint-results-debug.*
            tani/adminApp/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tani
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Create throwaway CI signing key
        run: |
          KEYSTORE="$RUNNER_TEMP/tani-ci-release.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass changeit \
            -keypass changeit \
            -alias tani-ci \
            -dname "CN=Tani CI,O=Tani,C=SD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -noprompt
          echo "TANI_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "TANI_RELEASE_STORE_PASSWORD=changeit" >> "$GITHUB_ENV"
          echo "TANI_RELEASE_KEY_ALIAS=tani-ci" >> "$GITHUB_ENV"
          echo "TANI_RELEASE_KEY_PASSWORD=changeit" >> "$GITHUB_ENV"
          echo "TANI_APP_LINK_HOST=ci.example.com" >> "$GITHUB_ENV"
          echo "TANI_RESET_REDIRECT=https://ci.example.com/auth/reset" >> "$GITHUB_ENV"
          echo "TANI_VERSION_CODE=7" >> "$GITHUB_ENV"
          echo "TANI_ADMIN_VERSION_CODE=7" >> "$GITHUB_ENV"
      - name: Verify release gate with CI credentials
        run: |
          bash qa/run_release_gate.sh --ci
          python3 qa/test_release_gate.py
      - name: Build signed minified release candidates
        run: |
          chmod +x gradlew
          TANI_GRADLE_ARGS=(
            --no-daemon --max-workers=1 --stacktrace
            -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs=-Xmx3072m
            "-PTANI_APP_LINK_HOST=$TANI_APP_LINK_HOST"
            "-PTANI_RESET_REDIRECT=$TANI_RESET_REDIRECT"
            "-PTANI_VERSION_CODE=$TANI_VERSION_CODE"
            "-PTANI_ADMIN_VERSION_CODE=$TANI_ADMIN_VERSION_CODE"
            "-PTANI_RELEASE_STORE_FILE=$TANI_RELEASE_STORE_FILE"
            "-PTANI_RELEASE_STORE_PASSWORD=$TANI_RELEASE_STORE_PASSWORD"
            "-PTANI_RELEASE_KEY_ALIAS=$TANI_RELEASE_KEY_ALIAS"
            "-PTANI_RELEASE_KEY_PASSWORD=$TANI_RELEASE_KEY_PASSWORD"
          )
          ./gradlew "${TANI_GRADLE_ARGS[@]}" :app:testReleaseUnitTest :adminApp:testReleaseUnitTest :app:lintRelease :adminApp:lintRelease
          ./gradlew "${TANI_GRADLE_ARGS[@]}" :app:bundleRelease :app:assembleRelease :adminApp:bundleRelease
      - name: Verify R8, signatures and release outputs
        run: |
          CUSTOMER_AAB="app/build/outputs/bundle/release/app-release.aab"
          ADMIN_AAB="adminApp/build/outputs/bundle/release/adminApp-release.aab"
          test -s "$CUSTOMER_AAB"
          test -s "$ADMIN_AAB"
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s adminApp/build/outputs/mapping/release/mapping.txt
          jarsigner -verify "$CUSTOMER_AAB" >/dev/null
          jarsigner -verify "$ADMIN_AAB" >/dev/null
          python3 qa/verify_native_page_size.py "$CUSTOMER_AAB" "$ADMIN_AAB"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - name: Upload CI-signed customer release candidate
        uses: actions/upload-artifact@v4
        with:
          name: tani-release-candidate-ci-signed-not-production
          path: tani/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload CI-signed admin release candidate
        uses: actions/upload-artifact@v4
        with:
          name: tani-admin-release-candidate-ci-signed-not-production
          path: tani/adminApp/build/outputs/bundle/release/adminApp-release.aab
          if-no-files-found: error
      - name: Upload release lint and mapping reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tani-release-check-reports
          path: |
            tani/app/build/reports/lint-results-release.*
            tani/adminApp/build/reports/lint-results-release.*
            tani/app/build/outputs/mapping/release/mapping.txt
            tani/adminApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
