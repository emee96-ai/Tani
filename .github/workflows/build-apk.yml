name: Build Tani APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop", "maintenance/**"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tani

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Project static QA
        run: bash qa/run_static_checks.sh

      - name: Android lint and unit tests
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tani-debug-apk
          path: tani/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
