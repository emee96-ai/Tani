name: Build Tani APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop", "maintenance/**"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run checkout database regression tests
        env:
          TANI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: bash tani/qa/run_database_tests.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tani
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Project static QA
        run: bash qa/run_static_checks.sh
      - name: Build APKs and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :adminApp:assembleDebug :adminApp:testDebugUnitTest --stacktrace
      - name: Verify Tani Admin APK
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK="adminApp/build/outputs/apk/debug/adminApp-debug.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "adminApp/build/outputs/apk/debug/Tani-Admin-debug.apk"
      - name: Upload Tani APK
        uses: actions/upload-artifact@v4
        with:
          name: tani-debug-apk
          path: tani/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Tani Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: tani-admin-verified-apk
          path: tani/adminApp/build/outputs/apk/debug/Tani-Admin-debug.apk
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tani
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Android lint
        run: chmod +x gradlew && ./gradlew --no-daemon :app:lintDebug :adminApp:lintDebug --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tani-lint-reports
          path: |
            tani/app/build/reports/lint-results-debug.*
            tani/adminApp/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: tani
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Create throwaway CI signing key
        run: |
          KEYSTORE="$RUNNER_TEMP/tani-ci-release.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass changeit \
            -keypass changeit \
            -alias tani-ci \
            -dname "CN=Tani CI,O=Tani,C=SD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -noprompt
          echo "TANI_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "TANI_RELEASE_STORE_PASSWORD=changeit" >> "$GITHUB_ENV"
          echo "TANI_RELEASE_KEY_ALIAS=tani-ci" >> "$GITHUB_ENV"
          echo "TANI_RELEASE_KEY_PASSWORD=changeit" >> "$GITHUB_ENV"
          echo "TANI_APP_LINK_HOST=ci.example.com" >> "$GITHUB_ENV"
          echo "TANI_RESET_REDIRECT=https://ci.example.com/auth/reset" >> "$GITHUB_ENV"
      - name: Verify release gate with CI credentials
        run: bash qa/run_release_gate.sh
      - name: Build signed minified release candidates
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:testReleaseUnitTest \
            :adminApp:testReleaseUnitTest \
            :app:lintRelease \
            :adminApp:lintRelease \
            :app:bundleRelease \
            :adminApp:bundleRelease \
            -PTANI_APP_LINK_HOST="$TANI_APP_LINK_HOST" \
            -PTANI_RESET_REDIRECT="$TANI_RESET_REDIRECT" \
            -PTANI_RELEASE_STORE_FILE="$TANI_RELEASE_STORE_FILE" \
            -PTANI_RELEASE_STORE_PASSWORD="$TANI_RELEASE_STORE_PASSWORD" \
            -PTANI_RELEASE_KEY_ALIAS="$TANI_RELEASE_KEY_ALIAS" \
            -PTANI_RELEASE_KEY_PASSWORD="$TANI_RELEASE_KEY_PASSWORD" \
            --stacktrace
      - name: Verify R8, signatures and release outputs
        run: |
          CUSTOMER_AAB="app/build/outputs/bundle/release/app-release.aab"
          ADMIN_AAB="adminApp/build/outputs/bundle/release/adminApp-release.aab"
          test -s "$CUSTOMER_AAB"
          test -s "$ADMIN_AAB"
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s adminApp/build/outputs/mapping/release/mapping.txt
          jarsigner -verify "$CUSTOMER_AAB" >/dev/null
          jarsigner -verify "$ADMIN_AAB" >/dev/null
      - name: Upload CI-signed customer release candidate
        uses: actions/upload-artifact@v4
        with:
          name: tani-release-candidate-ci-signed-not-production
          path: tani/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload CI-signed admin release candidate
        uses: actions/upload-artifact@v4
        with:
          name: tani-admin-release-candidate-ci-signed-not-production
          path: tani/adminApp/build/outputs/bundle/release/adminApp-release.aab
          if-no-files-found: error
      - name: Upload release lint and mapping reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tani-release-check-reports
          path: |
            tani/app/build/reports/lint-results-release.*
            tani/adminApp/build/reports/lint-results-release.*
            tani/app/build/outputs/mapping/release/mapping.txt
            tani/adminApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
