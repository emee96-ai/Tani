version: 2
updates:
  - package-ecosystem: gradle
    directory: /tani
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ['androidx.*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
